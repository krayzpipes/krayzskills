minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: local
    hooks:
      - id: prettier
        name: Format Markdown, YAML, and JSON
        language: node
        entry: prettier --write
        additional_dependencies: [prettier@3.9.10]
        types_or: [markdown, yaml, json]
      - id: markdownlint
        name: Validate Markdown
        language: node
        entry: markdownlint-cli2
        additional_dependencies: [markdownlint-cli2@0.23.3]
        types: [markdown]
      - id: validate-skills
        name: Validate skill metadata and local Markdown links
        language: python
        entry: python scripts/validate_skills.py
        additional_dependencies: [PyYAML==6.0.3, markdown-it-py==3.0.0]
        pass_filenames: false
        always_run: true
